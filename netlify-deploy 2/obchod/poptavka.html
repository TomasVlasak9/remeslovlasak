<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nezávazná poptávka | Řemeslné práce Vlasák</title><link rel="stylesheet" href="/styl.css"></head><body><main class="container" style="max-width:650px;padding:5rem 1rem"><a href="/obchod/">← Zpět do katalogu</a><h1 style="margin:2rem 0 1rem">Nezávazná poptávka</h1><form id="form"><label>Produkt<input required name="produkt" id="produkt"></label><label>Jméno<input required name="jmeno"></label><label>E-mail<input required type="email" name="email"></label><label>Telefon<input name="telefon"></label><label>Zpráva<textarea name="zprava" rows="5"></textarea></label><button class="btn btn-primary" type="submit">Odeslat poptávku</button><p id="stav"></p></form></main><script>var q=new URLSearchParams(location.search);document.getElementById('produkt').value=q.get('produkt')||'';document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();var f=new FormData(e.target),d=Object.fromEntries(f.entries());fetch('/api/poptavky',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(r=>r.json().then(x=>({ok:r.ok,x}))).then(v=>{if(!v.ok)throw Error(v.x.chyba||'Odeslání se nepovedlo.');e.target.reset();document.getElementById('stav').textContent='Děkujeme, ozveme se vám.'}).catch(x=>document.getElementById('stav').textContent=x.message)})</script></body></html>
