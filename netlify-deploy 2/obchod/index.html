<!DOCTYPE html>
<html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Katalog | Řemeslné práce Vlasák</title><link rel="stylesheet" href="/styl.css"></head>
<body><header id="header"><div class="header-inner"><a href="/" class="logo" aria-label="Řemeslné práce Vlasák"><div class="logo-text"><span class="logo-name">Řemeslné práce</span><span class="logo-tag">Vlasák · Klatovy</span></div></a><nav><ul id="navMenu"><li><a href="/">Domů</a></li><li><a href="/realizace/">Realizace</a></li><li><a href="/obchod/" aria-current="page">Katalog</a></li><li><a href="/#kontakt">Kontakt</a></li></ul></nav></div></header>
<main class="container" style="padding:7rem 1rem 5rem"><div class="section-head"><div class="section-eyebrow">Náš katalog</div><h1>Výrobky <em>na zakázku</em></h1><p>Vyberte si výrobek a pošlete nám nezávaznou poptávku. Dostupnost, cenu i předání s vámi následně potvrdíme.</p></div><div id="produkty" class="gallery"></div><p id="prazdno" hidden>Momentálně připravujeme nabídku.</p></main>
<script>
(function(){var box=document.getElementById('produkty'); fetch('/api/produkty?aktualni='+Date.now()).then(r=>r.json()).then(d=>{(d.polozky||[]).filter(p=>p.aktivni).forEach(p=>{var el=document.createElement('article');el.className='card';el.innerHTML=(p.obrazek?'<img src="'+p.obrazek.replace(/"/g,'&quot;')+'" alt="">':'')+'<h2>'+p.nazev+'</h2>'+(p.popis?'<p>'+p.popis+'</p>':'')+(p.cena?'<p><strong>'+p.cena+'</strong></p>':'')+'<a class="btn btn-primary" href="/obchod/poptavka.html?produkt='+encodeURIComponent(p.nazev)+'">Nezávazně poptat</a>';box.appendChild(el)});if(!box.children.length)document.getElementById('prazdno').hidden=false}).catch(()=>{document.getElementById('prazdno').hidden=false})})();
</script></body></html>
